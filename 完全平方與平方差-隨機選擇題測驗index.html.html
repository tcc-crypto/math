<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<title>恆等式小測驗</title>
<style>
body{background:#f4f7fb;color:#172554}.card{background:white;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 6px 22px #1e3a8a0a}.choice{display:flex;align-items:center;gap:.65rem;border:1px solid #dbe4f0;border-radius:12px;padding:.75rem;cursor:pointer;transition:.15s}.choice:hover{border-color:#6366f1;background:#f5f3ff}.choice:has(input:checked){border-color:#4f46e5;background:#eef2ff}.choice.correct{border-color:#16a34a;background:#f0fdf4}.choice.incorrect{border-color:#e11d48;background:#fff1f2}.choice input:disabled{cursor:default}.katex{font-size:1.06em}
</style>
</head>
<body class="min-h-screen p-4 md:p-8">
<main class="max-w-4xl mx-auto">
<header class="mb-6"><div class="text-indigo-600 font-bold text-sm tracking-wide">數學｜代數恆等式</div><h1 class="text-3xl md:text-4xl font-extrabold mt-2">完全平方與平方差</h1><p class="text-slate-600 mt-2">練習展開與因式分解。每題隨機生成 4 個選項；答完可繼續抽新題，無限練習。</p><div class="mt-4 flex flex-wrap items-center gap-3"><button id="downloadSite" class="rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-3">在新分頁開啟測驗</button><a id="openFallback" href="#" target="_blank" rel="noopener" class="hidden rounded-xl border border-indigo-300 px-4 py-3 font-semibold text-indigo-700">備用：點此開啟</a><span id="openHelp" class="text-sm text-slate-500">需要網絡載入公式和樣式；此按鈕不會建立公開分享網址。</span></div></header>
<section class="card p-4 md:p-5 mb-5"><div class="grid sm:grid-cols-2 gap-4"><label class="font-semibold text-sm">題目程度<select id="level" class="block mt-2 w-full rounded-xl border border-slate-300 p-3 bg-white"><option value="1">程度一｜基礎</option><option value="2">程度二｜較複雜</option></select></label><label class="font-semibold text-sm">題目類型<select id="kind" class="block mt-2 w-full rounded-xl border border-slate-300 p-3 bg-white"><option value="mixed">混合：展開及因式分解</option><option value="expand">展開</option><option value="factor">因式分解</option></select></label></div><button id="newQuiz" class="mt-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-3">重新開始（分數歸零）</button><span class="ml-3 text-sm text-slate-500">可重複抽題練習</span></section>
<section class="card p-4 md:p-5 mb-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3"><div><div class="grid grid-cols-2 gap-5"><div><div class="text-sm font-semibold text-slate-600">程度一｜基礎</div><div class="text-4xl font-extrabold text-indigo-700"><span id="score1">0</span><span class="text-lg ml-1">分</span></div></div><div><div class="text-sm font-semibold text-slate-600">程度二｜較複雜</div><div class="text-4xl font-extrabold text-violet-700"><span id="score2">0</span><span class="text-lg ml-1">分</span></div></div></div><p class="text-xs text-slate-500 mt-1">兩個程度分開計分；答對 +1 分、答錯 −1 分，各自最低 0 分。</p></div><div id="status" class="text-sm font-medium text-slate-600" aria-live="polite">選擇答案開始作答。</div></section>
<div id="quiz" class="space-y-4"></div>
<section class="card p-4 md:p-5 mt-5"><h2 class="font-bold text-lg">分享給學生</h2><p class="text-sm text-slate-600 mt-1">上方按鈕可在新分頁測試獨立測驗。若要讓學生透過網址開啟，仍需把網站檔案放到可公開瀏覽的網站空間；本程式不會自行發布公開網址。公式和外觀樣式需要網絡連線。</p></section>
</main>
<script>
const $=s=>document.querySelector(s), rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[rand(0,a.length-1)];
let question=null,scores={1:0,2:0},history=[],answered=false,audioCtx=null;
function poly(terms){let out='';for(const [n,m] of terms){if(!n)continue;const abs=Math.abs(n),part=m?(abs===1?m:`${abs}${m}`):String(abs);if(!out)out=(n<0?'-':'')+part;else out+=(n<0?' - ':' + ')+part;}return out||'0';}
function mono(n,v){return (n===1?'':n)+v;}
function makeExpand(level){const sign=pick([1,-1]),a=level===1?pick([1,1,2,3]):rand(2,5),b=rand(2,8),bi=level===2;const A=mono(a,'x'),B=bi?mono(b,'y'):String(b),cross=sign*2*a*b;
 const correct=poly(bi?[[a*a,'x^{2}'],[cross,'xy'],[b*b,'y^{2}']]:[[a*a,'x^{2}'],[cross,'x'],[b*b,'']]);
 const opts=[correct,poly(bi?[[a*a,'x^{2}'],[-cross,'xy'],[b*b,'y^{2}']]:[[a*a,'x^{2}'],[-cross,'x'],[b*b,'']]),poly(bi?[[a*a,'x^{2}'],[b*b,'y^{2}']]:[[a*a,'x^{2}'],[b*b,'']]),poly(bi?[[a*a,'x^{2}'],[-b*b,'y^{2}']]:[[a*a,'x^{2}'],[-b*b,'']])];
 return {kind:'expand',plain:`展開 (${A} ${sign>0?'+':'−'} ${B})²。`,prompt:`展開 $(${A} ${sign>0?'+':'-'} ${B})^{2}$。`,options:opts,correct};}
function makeFactor(level){const bi=level===2,a=bi?rand(2,5):1,b=rand(2,8),A=mono(a,'x'),B=bi?mono(b,'y'):String(b);const src=poly(bi?[[a*a,'x^{2}'],[-b*b,'y^{2}']]:[[a*a,'x^{2}'],[-b*b,'']]);
 const twiceB=bi?`2${B}`:String(2*b),correct=`(${A}-${B})(${A}+${B})`,opts=[correct,`(${A}-${B})^{2}`,`(${A}+${B})^{2}`,`(${A}-${B})(${A}+${twiceB})`];
 return {kind:'factor',plain:`將 ${src.replaceAll('^{2}','²')} 因式分解。`,prompt:`將 $${src}$ 因式分解。`,options:opts,correct};}
function renderMath(){if(window.renderMathInElement){renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}else if(document.readyState==='loading'&&!renderMath.waiting){renderMath.waiting=true;document.addEventListener('DOMContentLoaded',()=>{renderMath.waiting=false;renderMath();},{once:true});}}
function nextQuestion(){const level=Number($('#level').value),kind=$('#kind').value,type=kind==='mixed'?pick(['expand','factor']):kind;question=type==='expand'?makeExpand(level):makeFactor(level);question.level=level;question.options.sort(()=>Math.random()-.5);answered=false;$('#quiz').innerHTML=`<article class="card p-4 md:p-5"><div><span class="text-xs font-bold uppercase text-indigo-600">第 ${history.length+1} 題｜${question.kind==='expand'?'展開':'因式分解'}</span><h3 class="font-semibold text-lg mt-2">${question.prompt}</h3></div><div class="grid sm:grid-cols-2 gap-2 mt-4">${question.options.map((o,j)=>`<label class="choice"><input type="radio" name="answer" value="${j}" class="accent-indigo-600"><span>${String.fromCharCode(65+j)}. $${o}$</span></label>`).join('')}</div><div id="feedback" class="mt-4 text-sm font-bold" aria-live="polite"></div><button id="next" class="hidden mt-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-3">下一題</button></article>`;renderMath();}
function updateScores(){$('#score1').textContent=String(scores[1]);$('#score2').textContent=String(scores[2]);}
function startOver(){scores={1:0,2:0};history=[];updateScores();$('#status').textContent='選擇答案開始作答。';$('#status').className='text-sm font-medium text-slate-600';nextQuestion();}
function playCheer(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=audioCtx||new AC();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime;for(let i=0;i<5;i++){const start=now+i*.045,len=.85+Math.random()*.2,osc=audioCtx.createOscillator(),filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain(),base=240+i*47;osc.type='triangle';osc.frequency.setValueAtTime(base,start);osc.frequency.exponentialRampToValueAtTime(base*1.65,start+.24);osc.frequency.exponentialRampToValueAtTime(base*1.38,start+.58);osc.frequency.linearRampToValueAtTime(base*1.48,start+len);filter.type='lowpass';filter.frequency.value=1500;gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.075,start+.06);gain.gain.setValueAtTime(.07,start+len-.18);gain.gain.exponentialRampToValueAtTime(.0001,start+len);osc.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);osc.start(start);osc.stop(start+len);}for(let i=0;i<3;i++){const start=now+.12+i*.14,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=[523.25,659.25,783.99][i];gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.08,start+.025);gain.gain.exponentialRampToValueAtTime(.0001,start+.38);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(start);osc.stop(start+.4);}}catch(e){console.warn('歡呼音效無法播放',e);}}
function playRegret(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=audioCtx||new AC();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime;[[392,311],[349,262]].forEach(([from,to],i)=>{const start=now+i*.24,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(from,start);osc.frequency.exponentialRampToValueAtTime(to,start+.28);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.12,start+.025);gain.gain.exponentialRampToValueAtTime(.0001,start+.34);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(start);osc.stop(start+.36);});}catch(e){console.warn('惋惜音效無法播放',e);}}
function answerQuestion(index){if(answered)return;answered=true;const correctIndex=question.options.indexOf(question.correct),ok=index===correctIndex;scores[question.level]=Math.max(0,scores[question.level]+(ok?1:-1));history.push({question:question.plain,answer:`${String.fromCharCode(65+index)}. ${question.options[index]}`,type:'multiple-choice'});updateScores();document.querySelectorAll('#quiz .choice').forEach((label,j)=>{const input=label.querySelector('input');input.disabled=true;if(j===correctIndex)label.classList.add('correct');if(j===index&&!ok)label.classList.add('incorrect');});const feedback=$('#feedback');feedback.textContent=ok?'答對！+1 分。':'答錯！−1 分；綠色選項是正確答案。';feedback.className=`mt-4 text-sm font-bold ${ok?'text-emerald-700':'text-rose-600'}`;$('#next').classList.remove('hidden');$('#status').textContent=`已作答 ${history.length} 題｜程度一：${scores[1]} 分｜程度二：${scores[2]} 分`;$('#status').className='text-sm font-medium text-slate-600';if(ok)playCheer();else playRegret();}
$('#newQuiz').addEventListener('click',startOver);$('#quiz').addEventListener('change',e=>{if(e.target.matches('input[type="radio"]'))answerQuestion(Number(e.target.value));});$('#quiz').addEventListener('click',e=>{if(e.target.id==='next')nextQuestion();});startOver();
let standaloneUrl=null;$('#downloadSite').addEventListener('click',()=>{const html='<!doctype html>\\n'+document.documentElement.outerHTML;if(standaloneUrl)URL.revokeObjectURL(standaloneUrl);standaloneUrl=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));const opened=window.open(standaloneUrl,'_blank');const fallback=$('#openFallback');fallback.href=standaloneUrl;fallback.classList.remove('hidden');$('#openHelp').textContent=opened?'已嘗試在新分頁開啟；如未出現，請點備用連結或允許彈出式視窗。':'瀏覽器封鎖了新分頁，請點備用連結，或允許此頁開啟彈出式視窗。';});
</script>
</body></html>
